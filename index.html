<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ibin Joseph — Video Editor, Cinematographer, Photographer</title>
<meta name="description" content="Portfolio of Ibin Joseph: video editing, cinematography and photography.">
<meta property="og:title" content="Ibin Joseph — Portfolio">
<meta property="og:description" content="Video editing, cinematography and photography.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://filmsfromij.github.io/">
<meta property="og:image" content="https://filmsfromij.github.io/media/showreel.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://filmsfromij.github.io/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e0e0e'/%3E%3Crect x='14' y='8' width='4' height='16' fill='%23f2f0ec'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <a class="name" href="#top">Ibin Joseph</a>
  <nav aria-label="Sections">
    <a href="#commercial">Film</a>
    <a href="#photography">Photography</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main id="top">

  <section class="intro">
    <h1>Video editor, cinematographer and photographer.</h1>
  </section>

  <section class="reel" aria-label="Showreel">
    <video controls preload="none" playsinline poster="media/showreel.jpg" src="media/showreel.mp4"></video>
    <p class="cap"><span>Showreel</span><span>1:28</span></p>
  </section>

  <section id="commercial" class="block">
    <h2>Commercial</h2>
    <div class="grid one">
      <button class="tile" data-src="media/indian-taste.mp4" data-title="Indian Taste — Ad">
        <img src="media/indian-taste.jpg" alt="Man in a white shirt eating a snack in a car, from the Indian Taste ad" loading="lazy">
        <span class="cap"><span>Indian Taste — Ad</span><span>0:52</span></span>
      </button>
    </div>
  </section>

  <section class="block">
    <h2>Surrey Car Show</h2>
    <div class="grid">
      <button class="tile" data-src="media/show-highlight-2.mp4" data-title="Show montage">
        <img src="media/show-highlight-2.jpg" alt="Teal BMW coupe from behind on the show field" loading="lazy">
        <span class="cap"><span>Show montage</span><span>0:06</span></span>
      </button>
      <button class="tile" data-src="media/reel-4.mp4" data-title="Wheel transition">
        <img src="media/reel-4.jpg" alt="Black alloy wheel with a transition revealing an engine through the spokes" loading="lazy">
        <span class="cap"><span>Wheel transition</span><span>0:10</span></span>
      </button>
      <button class="tile" data-src="media/show-highlight-1.mp4" data-title="Teal coupe, walkaround">
        <img src="media/show-highlight-1.jpg" alt="Bronze wheel on a teal BMW coupe" loading="lazy">
        <span class="cap"><span>Teal coupe, walkaround</span><span>0:20</span></span>
      </button>
      <button class="tile" data-src="media/reel-3.mp4" data-title="VHS edit">
        <img src="media/reel-3.jpg" alt="Rear of a teal coupe with a VHS tape overlay" loading="lazy">
        <span class="cap"><span>VHS edit</span><span>0:11</span></span>
      </button>
      <button class="tile" data-src="media/show-highlight-3.mp4" data-title="On the field">
        <img src="media/show-highlight-3.jpg" alt="Teal BMW parked head-on on the show field" loading="lazy">
        <span class="cap"><span>On the field</span><span>0:20</span></span>
      </button>
      <button class="tile" data-src="media/reel-1.mp4" data-title="Classic BMW, detail">
        <img src="media/reel-1.jpg" alt="Badge and grille detail of a classic black BMW" loading="lazy">
        <span class="cap"><span>Classic BMW, detail</span><span>0:08</span></span>
      </button>
      <button class="tile" data-src="media/reel-5.mp4" data-title="Classic BMW, engine bay">
        <img src="media/reel-5.jpg" alt="Classic BMW wheel with a transition to the tan interior" loading="lazy">
        <span class="cap"><span>Classic BMW, engine bay</span><span>0:08</span></span>
      </button>
      <button class="tile" data-src="media/reel-2.mp4" data-title="Teal coupe">
        <img src="media/reel-2.jpg" alt="Headlight of a teal-green BMW coupe" loading="lazy">
        <span class="cap"><span>Teal coupe</span><span>0:15</span></span>
      </button>
      <button class="tile" data-src="media/show-highlight-4.mp4" data-title="On the hill">
        <img src="media/show-highlight-4.jpg" alt="Classic car on a grassy hill beside a tree" loading="lazy">
        <span class="cap"><span>On the hill</span><span>0:21</span></span>
      </button>
    </div>
  </section>

  <section id="photography" class="block">
    <h2>Photography</h2>
    <figure class="photo">
      <img src="media/photo-1.jpg" width="2400" height="1600" alt="Black and white portrait of a woman in a dark blazer seated at a long table in a library" loading="lazy">
    </figure>
  </section>

</main>

<footer id="contact" class="contact">
  <h2>Contact</h2>
  <p><a href="mailto:ibinjosephaj@gmail.com">ibinjosephaj@gmail.com</a></p>
  <p><a href="https://www.instagram.com/photos.ffi/" rel="noopener">Instagram @photos.ffi</a></p>
</footer>

<dialog id="player" aria-label="Video player">
  <button class="close" aria-label="Close video">Close</button>
  <video controls playsinline></video>
</dialog>

<script src="script.js"></script>
</body>
</html>
